name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Каркас Android-проекта
        run: |
          flutter create --org ru.zadacho --project-name app --platforms android --no-pub shell
          rm -rf shell/lib shell/test shell/pubspec.yaml
          mkdir -p shell/lib shell/assets
          cp pubspec.yaml shell/
          for f in lib/*.dart *.dart; do
            if [ -f "$f" ]; then cp "$f" shell/lib/; fi
          done
          for f in assets/icon.png assets/icon_fg.png assets/icon_orange.png assets/icon_bg.png icon.png icon_fg.png icon_orange.png icon_bg.png; do
            if [ -f "$f" ]; then cp "$f" shell/assets/; fi
          done
          test -f shell/lib/main.dart || { echo "::error::Не найден main.dart"; exit 1; }
          for need in icon.png icon_fg.png icon_orange.png icon_bg.png; do
            test -f "shell/assets/$need" || { echo "::error::Не найден файл иконки $need"; exit 1; }
          done
          ls shell/lib shell/assets

      - name: Зависимости и иконка
        working-directory: shell
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Звук уведомлений
        run: |
          mkdir -p shell/android/app/src/main/res/raw
          for f in assets/delo_notify.wav delo_notify.wav; do
            if [ -f "$f" ]; then cp "$f" shell/android/app/src/main/res/raw/delo_notify.wav; fi
          done
          test -f shell/android/app/src/main/res/raw/delo_notify.wav || { echo "::error::Не найден файл delo_notify.wav"; exit 1; }

      - name: Настройка Android (интернет, название, смена иконки)
        working-directory: shell
        run: python3 ../configure_android.py

      - name: Ключ подписи (постоянный, из секретов репозитория)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        working-directory: shell
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Не заданы секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sign"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sign/zadacho-release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/sign/zadacho-release.jks" python3 ../configure_signing.py

      - name: Сборка APK
        working-directory: shell
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Сборка AAB (для RuStore и Google Play)
        working-directory: shell
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Переименование
        run: |
          cp shell/build/app/outputs/flutter-apk/app-release.apk ZadaCho.apk
          cp shell/build/app/outputs/bundle/release/app-release.aab ZadaCho.aab

      - name: Проверка подписи
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs ZadaCho.apk | tee cert.txt
          if grep -qi "Android Debug" cert.txt; then
            echo "::error::APK подписан отладочным ключом, а не релизным"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZadaCho-apk
          path: ZadaCho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZadaCho-aab
          path: ZadaCho.aab

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ЗадаЧО, сборка ${{ github.run_number }}
          files: ZadaCho.apk
          make_latest: true
